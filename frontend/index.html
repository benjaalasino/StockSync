<!DOCTYPE html>

<html class="light" lang="en"><head>

<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fb;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .login-card-shadow {
            box-shadow: 0px 4px 12px rgba(27, 38, 59, 0.04);
        }
        input:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgba(0, 181, 226, 0.1);
        }
    </style>

<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-gutter">
<main class="w-full max-w-[440px]">
<!-- Brand Identity Section -->
<div class="flex flex-col items-center mb-base text-center">
<div class="mb-stack_lg">
<div class="w-16 h-16 bg-primary-container rounded-lg flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-on-primary text-[40px]" data-icon="corporate_fare">corporate_fare</span>
</div>
</div>
<h1 class="font-headline-xl text-headline-xl text-on-surface mb-stack_sm">Cyanbox ERP</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[320px]">
                Access your enterprise ecosystem and manage resources with precision.
            </p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-stack_lg login-card-shadow mt-gutter">
<form action="#" class="space-y-stack_lg" method="POST">
<!-- Email/Username Input -->
<div class="space-y-stack_sm">
<label class="block font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="username">Email or Username</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]" data-icon="person">person</span>
<input class="w-full h-[52px] pl-10 pr-4 bg-surface border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:border-primary-container transition-all" id="username" name="username" placeholder="name@company.com" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-stack_sm">
<div class="flex justify-between items-center">
<label class="block font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-on-primary-fixed-variant transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]" data-icon="lock">lock</span>
<input class="w-full h-[52px] pl-10 pr-12 bg-surface border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:border-primary-container transition-all" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline-variant hover:text-outline transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Remember Me & Security Context -->
<div class="flex items-center space-x-base">
<input class="w-4 h-4 text-primary-container border-outline-variant rounded focus:ring-primary-container" id="remember" name="remember" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant" for="remember">Remember this device for 30 days</label>
</div>
<!-- Login Button -->
<div class="pt-stack_sm">
<button class="w-full h-[52px] bg-primary-container text-on-primary font-headline-md text-headline-md rounded-lg shadow-sm hover:brightness-105 active:scale-[0.98] transition-all flex items-center justify-center space-x-base" type="submit">
<span>Login</span>
<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
<!-- Bottom Context -->
<div class="mt-stack_lg pt-stack_lg border-t border-outline-variant text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Internal System. By logging in, you agree to our 
                    <a class="text-primary hover:underline" href="#">Security Policy</a>.
                </p>
</div>
</div>
<!-- System Footer -->
<div class="mt-stack_lg flex flex-col items-center space-y-stack_sm">
<div class="flex items-center space-x-stack_md text-outline-variant">
<span class="material-symbols-outlined text-[18px]" data-icon="shield">shield</span>
<span class="font-label-sm text-label-sm uppercase">Secure 256-bit AES Encryption</span>
</div>
<p class="font-label-sm text-label-sm text-outline-variant">© 2024 Cyanbox Systems International. v4.2.1-stable</p>
</div>
</main>
<!-- Background Decorative Elements (Subtle Cyan Glows) -->
<div class="fixed top-0 right-0 -z-10 w-[600px] h-[600px] bg-primary opacity-[0.03] rounded-full blur-[120px] translate-x-1/2 -translate-y-1/2"></div>
<div class="fixed bottom-0 left-0 -z-10 w-[400px] h-[400px] bg-on-secondary-fixed-variant opacity-[0.03] rounded-full blur-[100px] -translate-x-1/2 translate-y-1/2"></div>
