version: "3.9"

services:
  backend:
    build: ./backend
    container_name: stocksync_backend
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env

  frontend:
    build: ./frontend
    container_name: stocksync_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
