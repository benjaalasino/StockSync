name: CI — StockSync

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stocksync
          POSTGRES_PASSWORD: stocksync
          POSTGRES_DB: stocksync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint — Ruff
        working-directory: backend
        run: ruff check app/

      - name: Metrics — Radon CC (info only)
        working-directory: backend
        run: radon cc app/ -s -a

      - name: Metrics — Radon MI (info only)
        working-directory: backend
        run: radon mi app/ -s

      - name: Run tests + coverage
        working-directory: backend
        env:
          DATABASE_URL: postgresql://stocksync:stocksync@localhost:5432/stocksync_test
          SECRET_KEY: test-secret-key
        run: pytest tests/ --cov=app --cov-report=term-missing --cov-fail-under=60

  frontend:
    name: Frontend (lint)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Lint — ESLint
        working-directory: frontend
        run: npm run lint
